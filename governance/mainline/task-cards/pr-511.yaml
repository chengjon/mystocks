acceptance:
  checks:
    - id: "diff-check"
      command: "git diff --check"
      required: true
    - id: "mainline-gate"
      command: "python governance/mainline/scripts/mainline_scope_gate.py --task-card governance/mainline/task-cards/pr-511.yaml --schema governance/mainline/schemas/ai-task-card.schema.json --base-sha origin/main --head-sha HEAD --report /tmp/pr511-mainline-gate.json"
      required: true
    - id: "hardcoding-scan"
      command: "python scripts/security/hardcoding_scan.py"
      required: true

risk_and_rollback:
  risks:
    - "scripts/dev/page_api_probe.py was edited to replace hardcoded admin/admin123 with env-var lookups (MYSTOCKS_PROBE_USERNAME / MYSTOCKS_PROBE_PASSWORD). If existing local workflows rely on the defaults, they must export the env vars before re-running the probe."
    - "governance/mainline/reports/mainline-governance-report.json is a stale snapshot from 2026-07-07; tracked as a historical baseline, future regeneration handled by governance workflows."
  rollback_plan: "git revert <merge-commit-sha>; page_api_probe.py is a dev-only script and the new env-var lookup is backward-compatible (returns empty headers when vars are absent)"

delivery:
  six_line_summary_required: true
  six_line_summary:
    change_purpose: "track 24 long-pending real project assets (docs/api/, docs/architecture/, docs/guides/, docs/ops/, docs/references/, docs/worklogs/claude-auto/, scripts/dev/ + scripts/sql/, governance/mainline/) and fix a P1 hardcoded-credential finding in scripts/dev/page_api_probe.py"
    modified_scope: "24 new files tracked (docs + scripts + governance) + 1 file patched (scripts/dev/page_api_probe.py: replace admin/admin123 with os.environ lookups) + governance/mainline/task-cards/pr-511.yaml"
    dependency_changes: "none"
    legacy_logic_impact: "page_api_probe.py now requires MYSTOCKS_PROBE_USERNAME / MYSTOCKS_PROBE_PASSWORD env vars to use auth — graceful no-op when absent"
    rollback_ready: "yes"
    risk_and_rollback_point: "git revert if any local dev workflow depends on the hardcoded admin/admin123 defaults"

governance:
  phase: "phase_a_pr_hard_gate"
  mainline_drift_threshold_percent: 5
  stop_rule_owner: "main"
  stop_rule_sla_hours: 24
  approval:
